<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240">
  <!-- Header decoration: globe, paper plane with dashed flight path, stars. White on the navy header. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- globe -->
    <g stroke-opacity=".28" stroke-width="2.5">
      <circle cx="330" cy="150" r="62"/>
      <ellipse cx="330" cy="150" rx="26" ry="62"/>
      <path d="M268 150 h124 M276 118 h108 M276 182 h108"/>
    </g>
    <!-- orbit ring -->
    <ellipse cx="330" cy="150" rx="96" ry="24" transform="rotate(-18 330 150)" stroke="#FFC53D" stroke-opacity=".55" stroke-width="2.5"/>
    <!-- flight path -->
    <path d="M20 210 C 90 150, 140 220, 190 150 S 250 60, 300 48" stroke-opacity=".4" stroke-width="2.5" stroke-dasharray="6 10"/>
  </g>
  <!-- paper plane -->
  <g transform="translate(300 26) rotate(-12)">
    <path d="M0 22 L58 0 L40 48 L26 32 Z" fill="#fff" fill-opacity=".9"/>
    <path d="M26 32 L58 0 L20 26 Z" fill="#D9E0FF"/>
    <path d="M26 32 L30 44 L40 48 Z" fill="#B8C5F5"/>
  </g>
  <!-- stars -->
  <g fill="#FFC53D">
    <path d="M60 60 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1z" fill-opacity=".8"/>
    <path d="M150 30 l2.5 6 6 .6 -4.5 4 1.3 6 -5.3 -3 -5.3 3 1.3 -6 -4.5 -4 6 -.6z" fill-opacity=".6"/>
    <circle cx="228" cy="210" r="4" fill-opacity=".6"/>
    <circle cx="110" cy="120" r="3" fill-opacity=".5"/>
    <circle cx="420" cy="80" r="3.5" fill-opacity=".6"/>
  </g>
</svg>
