<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Quiet background: abstract sketched lines (pencil-like strokes, no objects).
       One muted navy colour at very low opacity. Every stroke stays inside the tile,
       so the pattern repeats without visible seams. -->
  <g fill="none" stroke="#16213E" stroke-linecap="round" stroke-linejoin="round">
    <!-- long wavy stroke, drawn twice like two pencil passes -->
    <g stroke-opacity=".07" stroke-width="1.6">
      <path d="M40 120 C 110 70, 170 170, 250 115 S 380 60, 430 110"/>
      <path d="M44 126 C 112 80, 172 176, 252 122 S 378 70, 426 116" stroke-opacity=".04"/>
    </g>
    <!-- loose arc -->
    <g stroke-opacity=".06" stroke-width="1.5">
      <path d="M470 60 C 560 70, 600 150, 580 230"/>
      <path d="M476 66 C 552 80, 590 150, 572 222" stroke-opacity=".04"/>
    </g>
    <!-- scribbled loop -->
    <path stroke-opacity=".06" stroke-width="1.4"
      d="M120 300 c 20 -30 60 -26 58 4 c -2 28 -46 34 -52 8 c -6 -24 30 -40 52 -22 c 24 20 6 52 -18 50"/>
    <!-- hatching -->
    <g stroke-opacity=".07" stroke-width="1.3">
      <path d="M430 300 l 26 -26 M442 306 l 26 -26 M454 312 l 26 -26 M466 318 l 26 -26 M478 324 l 22 -22"/>
    </g>
    <!-- gentle zig-zag -->
    <path stroke-opacity=".06" stroke-width="1.5" d="M260 250 l 18 16 l 16 -18 l 18 16 l 16 -18 l 18 16"/>
    <!-- long diagonal sweep -->
    <g stroke-opacity=".06" stroke-width="1.5">
      <path d="M60 560 C 150 470, 260 520, 330 430"/>
      <path d="M66 566 C 156 480, 262 528, 334 438" stroke-opacity=".035"/>
    </g>
    <!-- open circle, not quite closed -->
    <path stroke-opacity=".06" stroke-width="1.5" d="M520 470 a 48 44 0 1 1 -30 -40"/>
    <!-- short dashes and a small wave -->
    <g stroke-opacity=".07" stroke-width="1.4">
      <path d="M380 560 h 22 M412 556 h 14 M436 560 h 26"/>
      <path d="M200 400 q 12 -12 24 0 t 24 0 t 24 0"/>
      <path d="M560 360 v 20 M572 352 v 34"/>
    </g>
  </g>
</svg>
