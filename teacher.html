<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher desk</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/teacher.css">
</head>
<body>

<!-- sign-in -->
<div class="signin" id="signin" hidden>
  <div class="signin-card">
    <div class="logo">✦</div>
    <h1>Teacher desk</h1>
    <p>Sign in with your Google account to see your students’ work.</p>
    <button class="btn primary" id="in">Sign in with Google</button>
    <p class="err" id="err"></p>
  </div>
</div>

<div class="app" id="app" hidden>
  <!-- sidebar (collapsible) -->
  <aside class="side" id="side">
    <div class="side-top">
      <button class="brand" data-go="overview" title="Overview"><span class="logo">✦</span><span class="hide-mini">Teacher desk</span></button>
      <button class="icon-btn collapse" id="collapse" title="Collapse the list">‹</button>
    </div>
    <button class="nav-item" data-go="overview"><span class="ico">⌂</span><span class="hide-mini">All students</span></button>
    <div class="side-label hide-mini">Students</div>
    <nav id="students"></nav>
    <div class="side-foot">
      <span class="who hide-mini" id="who"></span>
      <button class="icon-btn" id="out" title="Sign out">⏻</button>
    </div>
  </aside>

  <main class="main">
    <!-- overview -->
    <section class="view" id="v-overview">
      <header class="head">
        <div>
          <p class="eyebrow" id="today"></p>
          <h1>Your students</h1>
        </div>
      </header>
      <div class="grid-cards" id="overview"></div>
    </section>

    <!-- one student's dashboard -->
    <section class="view" id="v-dash" hidden>
      <header class="head">
        <div class="head-left">
          <div class="avatar big" id="d-avatar"></div>
          <div>
            <p class="eyebrow" id="d-status"></p>
            <h1 id="d-name"></h1>
          </div>
        </div>
        <div class="head-actions">
          <button class="btn" id="d-report">📄 Progress report</button>
          <button class="btn primary" id="d-live">● Watch live</button>
        </div>
      </header>
      <div class="tiles" id="d-tiles"></div>
      <div id="d-pages"></div>
    </section>

    <!-- live view of one page -->
    <section class="view viewer" id="v-view" hidden>
      <header class="viewer-bar">
        <button class="btn ghost" id="v-back">← Dashboard</button>
        <div class="viewer-title"><span class="avatar small" id="v-avatar"></span><b id="v-title"></b><span class="pill" id="v-live"></span></div>
        <div class="viewer-tools">
          <label class="switch"><input type="checkbox" id="follow" checked><span></span>Follow</label>
          <label class="switch"><input type="checkbox" id="check" checked><span></span>Right / wrong</label>
          <button class="btn ghost" id="v-latest" title="Scroll to the answer that changed last">✨ Latest answer</button>
          <button class="btn ghost danger" id="v-reset">↺ Reset page</button>
        </div>
      </header>
      <div class="frames">
        <iframe class="frame" id="frame-a" title="Student page"></iframe>
        <iframe class="frame" id="frame-b" title="Student page" hidden></iframe>
        <div class="frame-empty" id="v-empty">Waiting for the student to open a page…</div>
      </div>
    </section>

    <!-- printable progress report (Russian) -->
    <section class="view" id="v-report" hidden>
      <header class="head no-print">
        <div>
          <p class="eyebrow">Progress report · edit any text, it’s saved automatically</p>
          <h1 id="r-heading"></h1>
        </div>
        <div class="head-actions">
          <button class="btn" id="r-back">← Dashboard</button>
          <button class="btn primary" id="r-print">🖨 Print / PDF</button>
        </div>
      </header>
      <article class="report" id="report"></article>
    </section>
  </main>
</div>

<!-- mark / comment dialog -->
<dialog class="dlg" id="note-dlg">
  <form method="dialog" class="dlg-body">
    <h2>Mark this answer</h2>
    <p class="dlg-answer" id="note-answer"></p>
    <div class="marks">
      <label><input type="radio" name="mark" value="right"><span class="mark r">✓ Right</span></label>
      <label><input type="radio" name="mark" value="wrong"><span class="mark w">✗ Wrong</span></label>
      <label><input type="radio" name="mark" value=""><span class="mark n">No mark</span></label>
    </div>
    <label class="field">Comment for the student <small>(shown under the answer on their page)</small>
      <textarea id="note-text" rows="3" placeholder="e.g. Check the spelling!"></textarea>
    </label>
    <div class="dlg-actions">
      <button class="btn ghost danger" value="delete" id="note-del">Delete</button>
      <span class="spacer"></span>
      <button class="btn ghost" value="cancel">Cancel</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script type="module" src="assets/teacher.js"></script>
</body>
</html>
